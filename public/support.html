<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CyberCache Support</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101114;
        --panel: #181b20;
        --text: #f4f1e8;
        --muted: #b9b1a2;
        --line: #333843;
        --accent: #67e8f9;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.58;
      }

      main {
        width: min(780px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0 56px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.2;
      }

      p {
        color: var(--muted);
      }

      a {
        color: var(--accent);
      }

      .panel {
        margin-top: 24px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CyberCache Support</h1>
      <p>
        For CyberCache support, privacy questions, account help, or data
        deletion requests, contact:
      </p>
      <section class="panel">
        <p>
          <a href="mailto:michaelhmiv@gmail.com">michaelhmiv@gmail.com</a>
        </p>
      </section>
      <p>
        Privacy policy:
        <a href="/privacy-policy.html">/privacy-policy.html</a>
      </p>
      <p>
        Data deletion:
        <a href="/data-deletion.html">/data-deletion.html</a>
      </p>
    </main>
  </body>
</html>
