<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/cybercache-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cybercache</title>
    <meta name="description" content="CyberCache — an idle roguelite looter. Crack caches, build your hunter, trade on a pure player market." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CyberCache" />
    <meta property="og:title" content="CyberCache" />
    <meta property="og:description" content="An idle roguelite looter. Crack caches, build your hunter, trade on a pure player market." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The CyberCache crate, cracked open in a burst of gold light" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CyberCache" />
    <meta name="twitter:description" content="An idle roguelite looter. Crack caches, build your hunter, trade on a pure player market." />
    <meta name="twitter:image" content="/og-image.png" />
    <style>
      #root:empty::before {
        content: '';
      }
      .boot-fallback {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #08090d;
        color: #f3f4f6;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
        gap: 12px;
      }
      .boot-fallback-title {
        font-size: 22px;
        font-weight: 900;
        color: #ff4b5c;
      }
      .boot-fallback-body {
        font-size: 13px;
        color: #9ca3af;
        max-width: 320px;
        line-height: 1.5;
      }
    </style>
    <script>
      window.__cybercacheBoot = {
        stage: 'html-parsed',
        errors: [],
        logs: ['HTML parsed at ' + new Date().toISOString()],
        mark: function (stage) {
          this.stage = stage;
          this.logs.push(stage + ' at ' + new Date().toISOString());
          try { console.log('[boot]', stage); } catch (e) {}
        }
      };

      window.addEventListener('error', function (event) {
        window.__cybercacheBoot.errors.push({
          type: 'error',
          message: event.message,
          filename: event.filename,
          lineno: event.lineno,
          colno: event.colno,
          error: event.error ? String(event.error) : null,
        });
        window.__cybercacheBoot.mark('error: ' + (event.message || 'unknown'));
      });

      window.addEventListener('unhandledrejection', function (event) {
        window.__cybercacheBoot.errors.push({
          type: 'unhandledrejection',
          reason: event.reason ? String(event.reason) : null,
        });
        window.__cybercacheBoot.mark('unhandledrejection');
      });

      // Attach listeners to the Vite module script once Vite injects it.
      var bootObserver = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          mutation.addedNodes.forEach(function (node) {
            if (node.tagName === 'SCRIPT' && node.type === 'module') {
              window.__cybercacheBoot.mark('module-script-injected');
              node.addEventListener('load', function () {
                window.__cybercacheBoot.mark('module-script-loaded');
              });
              node.addEventListener('error', function (e) {
                window.__cybercacheBoot.mark('module-script-error');
                window.__cybercacheBoot.errors.push({
                  type: 'script-error',
                  src: node.src,
                  message: e && e.message ? e.message : 'script failed to load'
                });
              });
              bootObserver.disconnect();
            }
          });
        });
      });
      bootObserver.observe(document.documentElement, { childList: true, subtree: true });

      window.__cybercacheBootTimeout = setTimeout(function () {
        const root = document.getElementById('root');
        if (root && root.childElementCount === 0) {
          const info = window.__cybercacheBoot;
          const errorList = info.errors.length
            ? '<ul style="text-align:left;font-size:11px;color:#ff4b5c;margin:8px 0;padding-left:18px;">' +
              info.errors.map(function (e) {
                return '<li>' + (e.type || 'error') + ': ' + String(e.message || e.reason || e.src || JSON.stringify(e)).slice(0, 200) + '</li>';
              }).join('') +
              '</ul>'
            : '<div style="font-size:11px;color:#9ca3af;margin-top:8px;">No window errors captured.</div>';
          const logs = info.logs.length
            ? '<div style="text-align:left;font-size:10px;color:#6b7280;margin-top:12px;max-height:120px;overflow:auto;background:#0e1016;padding:8px;border-radius:6px;">' +
              info.logs.map(function (l) { return '<div>' + l + '</div>'; }).join('') +
              '</div>'
            : '';
          // Offline is not a boot failure (audit A-10): when the
          // device has no connection, the bundle simply cannot load
          // — say that, instead of diagnosing a broken app.
          if (typeof navigator !== 'undefined' && navigator.onLine === false) {
            root.innerHTML =
              '<div class="boot-fallback">' +
              '<div class="boot-fallback-title">You\'re offline</div>' +
              '<div class="boot-fallback-body">CyberCache could not load because this device has no connection. Reconnect, then reload to play.</div>' +
              '</div>';
            return;
          }
          root.innerHTML =
            '<div class="boot-fallback">' +
            '<div class="boot-fallback-title">App did not boot</div>' +
            '<div class="boot-fallback-body">Stage: <b>' + info.stage + '</b><br>JS runtime is ' + (typeof window !== 'undefined' ? 'available' : 'missing') + '.</div>' +
            errorList +
            logs +
            '</div>';
        }
      }, 3000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <div class="boot-fallback">
        <div class="boot-fallback-title">JavaScript required</div>
        <div class="boot-fallback-body">CyberCache requires JavaScript to run. Please enable JavaScript in your browser settings.</div>
      </div>
    </noscript>
  </body>
</html>
