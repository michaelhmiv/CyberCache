name: Play Internal Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Play release name
        required: false
        type: string

jobs:
  android:
    runs-on: ubuntu-latest
    environment:
      name: CyberCache / internal
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_ADMOB_REWARDED_CACHE_KEY_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_CACHE_KEY_AD_UNIT_ID }}
          VITE_ADMOB_TEST_ADS: "false"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Validate Play + signing secrets
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          required=(
            PLAY_SERVICE_ACCOUNT_JSON
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret ${name}"
              exit 1
            fi
          done

      - name: Write Firebase config
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Compute release metadata
        env:
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
        run: |
          VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))
          echo "MOBILE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          if [ -n "$INPUT_RELEASE_NAME" ]; then
            SANITIZED_RELEASE_NAME="$(printf '%s' "$INPUT_RELEASE_NAME" | tr '\r\n' '-' | tr -cd '[:alnum:]._-' | cut -c1-50)"
            if [ -z "$SANITIZED_RELEASE_NAME" ]; then
              echo "::error::release_name must contain at least one alphanumeric character after sanitization."
              exit 1
            fi
            echo "PLAY_RELEASE_NAME=$SANITIZED_RELEASE_NAME" >> "$GITHUB_ENV"
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            echo "PLAY_RELEASE_NAME=internal-${SHORT_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Build signed Android App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MOBILE_VERSION_CODE: ${{ env.MOBILE_VERSION_CODE }}
          MOBILE_VERSION_NAME: ${{ env.PLAY_RELEASE_NAME }}
          ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
        run: node scripts/run-gradle-wrapper.mjs bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: cybercache-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.michaelhmiv.cybercache
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ env.PLAY_RELEASE_NAME }}

      - name: Summarize tester install links
        run: |
          {
            echo "## CyberCache internal release"
            echo ""
            echo "- Release: \`${PLAY_RELEASE_NAME}\`"
            echo "- Package: \`com.michaelhmiv.cybercache\`"
            echo "- Track: \`internal\`"
            echo "- Tester opt-in: https://play.google.com/apps/testing/com.michaelhmiv.cybercache"
            echo "- Play listing: https://play.google.com/store/apps/details?id=com.michaelhmiv.cybercache"
            echo ""
            echo "Testers must be added to the CyberCache internal testing email list or Google Group in Play Console, then open the opt-in link once on their Android device."
          } >> "$GITHUB_STEP_SUMMARY"
