name: iOS CI

# iOS gate, mirroring Android CI (android-ci.yml) lane for lane: ios-build
# archives the Capacitor app with CI-minted signing (the runner creates its
# own distribution certificate + profile through the App Store Connect API —
# the PitTech pattern; no local-device steps anywhere), and ios-simulator
# boots the app on a simulator and runs the smoke assertions in
# scripts/ios-smoke/. Runs on every PR and on pushes to master that touch
# the app, the web build, or the iOS shell.
#
# Both jobs need the iOS target from the launch brief's Track 1
# (feat/ios-scaffold). Until it lands they fail fast at the target guard —
# deliberately: a lane that silently skips is not a lane.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - "ios/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "scripts/ios-signing/**"
      - "scripts/ios-smoke/**"
      - ".github/actions/ios-signing/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

concurrency:
  group: cybercache-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: ios-build
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Require the iOS target
        run: |
          set -euo pipefail
          if [[ ! -d ios/App/App.xcodeproj ]]; then
            echo "::error::ios/App/App.xcodeproj not found — the iOS target (iOS launch brief Track 1) has not landed on this ref yet."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Mint CI signing material (App Store Connect API)
        uses: ./.github/actions/ios-signing

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Archive with CI signing
        run: >-
          xcodebuild archive
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/CyberCache.xcarchive
          -derivedDataPath build/ios-release
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="Apple Distribution"
          CODE_SIGNING_KEYCHAIN="$CYBERCACHE_KEYCHAIN_PATH"
          PROVISIONING_PROFILE_SPECIFIER="$CYBERCACHE_PROFILE_NAME"
          DEVELOPMENT_TEAM="$CYBERCACHE_TEAM_ID"

      - name: Export the signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>TEAMID</string>
            <key>provisioningProfiles</key><dict>
              <key>com.michaelhmiv.cybercache</key><string>PROFILE</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :teamID $CYBERCACHE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.michaelhmiv.cybercache $CYBERCACHE_PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath build/CyberCache.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Verify the exported IPA
        run: |
          set -euo pipefail
          ipa=$(find build/export -name '*.ipa' | head -1)
          if [[ -z "$ipa" ]]; then
            echo "::error::No IPA was exported."
            exit 1
          fi
          work="$RUNNER_TEMP/ipa-check"
          mkdir -p "$work"
          unzip -q "$ipa" -d "$work"
          app=$(find "$work/Payload" -maxdepth 1 -name '*.app' | head -1)
          if [[ -z "$app" ]]; then
            echo "::error::IPA contains no .app bundle."
            exit 1
          fi
          if [[ ! -f "$app/embedded.mobileprovision" ]]; then
            echo "::error::Exported app has no embedded provisioning profile — it is not the CI-signed build."
            exit 1
          fi
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          if [[ "$bundle" != "com.michaelhmiv.cybercache" ]]; then
            echo "::error::Exported bundle ID is $bundle, expected com.michaelhmiv.cybercache."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "Verified signed IPA: $ipa (bundle $bundle)"

      - name: Upload archive and IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-store-build
          path: |
            build/CyberCache.xcarchive
            build/export/*.ipa
          if-no-files-found: warn
          retention-days: 14

  ios-simulator:
    name: ios-simulator
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Require the iOS target
        run: |
          set -euo pipefail
          if [[ ! -d ios/App/App.xcodeproj ]]; then
            echo "::error::ios/App/App.xcodeproj not found — the iOS target (iOS launch brief Track 1) has not landed on this ref yet."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install the WebInspector proxy (smoke test transport)
        run: brew install ios-webkit-debug-proxy

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios-simulator
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGN_IDENTITY=-
          build

      - name: Smoke test on a booted simulator
        run: |
          set -euo pipefail
          app=$(find build/ios-simulator/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          if [[ -z "$app" ]]; then
            echo "::error::No simulator .app was produced by the build."
            exit 1
          fi
          APP_PATH="$app" OUT_DIR=build/ios-smoke node scripts/ios-smoke/run-smoke.mjs

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-smoke
          path: build/ios-smoke/
          if-no-files-found: warn
          retention-days: 14
