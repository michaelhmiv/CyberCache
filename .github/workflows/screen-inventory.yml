name: Screen Inventory

# On-demand screen inventory: boots the app on a Pixel 7 emulator
# (API 35 — same profile as android-ci's emulator job), enters as a
# guest, crawls every reachable screen with UiAutomator, and uploads
# the screenshots + window hierarchies + manifest.json as the
# `screen-inventory` artifact. This is the design-review evidence
# harness — real renders of the real APK, not descriptions.
#
# The crawl runs as six per-area SEGMENTS (board / action / gear /
# market / rank / hunter) in a PARALLEL MATRIX: each segment gets its
# own runner and its own emulator (job "Crawl segment (<segment>)",
# fail-fast: false), runs only its own @Test method via
# scripts/crawl-screen-inventory.sh <segment>, and uploads whatever
# it captured — partial manifest, diagnostics, everything — as
# artifact screen-inventory-segment-<segment> with if: always(). A
# second job ("Merge inventory + coverage gate", needs: crawl,
# if: always()) downloads all six segment artifacts, assembles them
# into the layout scripts/merge-screen-inventory.py consumes, merges
# them into the ONE final manifest, uploads the `screen-inventory`
# artifact, and runs the MIN_REACHED_STOPS coverage verify.
#
# Why this shape: run 2 (41343111864) lost everything when the
# emulator died inside a single monolithic crawl; the segmented
# design (PR #257) capped that loss at one segment but still ran all
# six segments sequentially inside ONE step — run 3 (41346444027)
# spent ~2 hours inside that step with zero per-segment visibility
# (worst-case segment timeouts × retries stack past the job ceiling)
# and was cancelled. Parallel matrix jobs fix both problems at once:
# total wall-clock ≈ the slowest single segment instead of the sum,
# every segment's state is separately visible in the Actions UI, a
# dead segment costs only itself, and no segment's retries can eat
# another segment's budget. Recovery WITHIN a segment is unchanged:
# per-segment pulls, one emulator restart + one retry, and stops of a
# segment that still produces no manifest are recorded as missed
# ("emulator died") by the merge.
#
# MANUAL DISPATCH ONLY, by design (owner directive, 2026-11-01): it is
# deliberately NOT part of per-PR CI — a full crawl takes minutes of
# emulator time and its output is a design artifact, not a gate.
# Run it from the Actions tab when a fresh inventory is needed.
# See docs/SCREEN_INVENTORY.md.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Minimum number of crawl stops that must be REACHED (anchor-verified
  # captures in manifest.json) for this run to pass. Run 1 (2026-11-01)
  # reached 7 of 32 and the job still reported success — a partial set
  # presented as complete is the failure mode this gate exists to kill.
  # The crawl targets all 32 stops; 28 is the floor below which the
  # inventory is too incomplete to hand to a design review. The missed
  # screens are listed in the merge job's summary either way.
  MIN_REACHED_STOPS: 28

jobs:
  # One matrix job per crawl segment, all running in parallel on
  # separate runners. fail-fast: false is load-bearing: one segment's
  # failure must never cancel the other five.
  crawl:
    name: Crawl segment (${{ matrix.segment }})
    runs-on: ubuntu-latest
    # 35 min covers: dependency install + web/APK build (~5-8 min),
    # emulator boot, one healthy segment crawl (single-digit minutes),
    # and the in-segment recovery budget (one restart + one retry of a
    # dead segment). A segment that cannot finish inside that is dead
    # weight — the merge records its stops as missed and moves on.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        segment: [board, action, gear, market, rank, hunter]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Accept Android SDK licenses and install platform 36
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Fail fast: both APKs (app + instrumented tests, incl. the
      # inventory crawl) must compile before any emulator boots.
      # -PincludeScreenInventory is what adds ScreenInventoryTest to the
      # androidTest source set (see android/app/build.gradle) — without
      # it the class is not in the test APK at all, which is also why
      # per-PR connectedDebugAndroidTest never runs it.
      - name: Compile app + instrumented tests (fail fast)
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest -PincludeScreenInventory --stacktrace

      # Run ONLY this matrix entry's segment: one `am instrument` call
      # for the segment's @Test method, an `adb pull` of the inventory
      # dir after the segment, and — if the pull has no manifest — an
      # emulator restart + exactly one retry inside the same job (see
      # scripts/crawl-screen-inventory.sh). The script always exits 0:
      # segment failure is data for the merge + verify job below.
      - name: Crawl segment on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          working-directory: android
          script: bash ../scripts/crawl-screen-inventory.sh ${{ matrix.segment }}

      # Upload whatever this segment produced — partial pulls and
      # diagnostics included — even when the crawl step failed or the
      # job was cancelled: a dead segment's evidence is exactly what
      # the merge needs to record its stops honestly.
      - name: Upload segment inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-inventory-segment-${{ matrix.segment }}
          path: screen-inventory-out/
          if-no-files-found: warn
          retention-days: 30

  # Merge + gate job. needs: crawl with if: always() so it runs even
  # when some (or all) segment jobs failed or were cancelled: whatever
  # segments reported get merged, and segments that never reported are
  # synthesized as missed by the merge script.
  inventory:
    name: Merge inventory + coverage gate
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # One subdirectory per artifact: segment-artifacts/
      # screen-inventory-segment-<segment>/. Zero matches (every crawl
      # job died before uploading) is a legitimate, if dire, outcome —
      # the merge then synthesizes all 32 stops as never-reported
      # misses and the verify step fails the run with the full list —
      # so a failed download must not stop this job.
      - name: Download segment inventories
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: screen-inventory-segment-*
          path: segment-artifacts

      # Assemble the per-segment uploads into the single
      # screen-inventory-out/ layout scripts/merge-screen-inventory.py
      # consumes: segments/ merged across jobs, diagnostics collected,
      # dead-segments.txt concatenated (each crawl job writes only its
      # own segment's dead letter, or an empty file).
      - name: Assemble merged crawl output
        if: always()
        run: |
          mkdir -p screen-inventory-out/segments
          : > screen-inventory-out/dead-segments.txt
          for artifact in segment-artifacts/screen-inventory-segment-*; do
            if [ ! -d "$artifact" ]; then
              continue
            fi
            if [ -d "$artifact/segments" ]; then
              cp -r "$artifact/segments/." screen-inventory-out/segments/
            fi
            for diag in "$artifact"/diagnostics-*.txt; do
              if [ -f "$diag" ]; then
                cp "$diag" screen-inventory-out/
              fi
            done
            if [ -f "$artifact/dead-segments.txt" ]; then
              cat "$artifact/dead-segments.txt" >> screen-inventory-out/dead-segments.txt
            fi
          done
          sort -u -o screen-inventory-out/dead-segments.txt screen-inventory-out/dead-segments.txt
          echo "Assembled crawl output:"
          find screen-inventory-out -maxdepth 3 | sort | head -100

      # Merge the per-segment pulls into the ONE final inventory:
      # screen-inventory-final/manifest.json (all 32 stops, canonical
      # order; dead segments' stops synthesized as missed) + the
      # renumbered screenshots/hierarchies + any diagnostics files.
      - name: Merge segment manifests
        if: always()
        run: python3 scripts/merge-screen-inventory.py screen-inventory-out screen-inventory-final

      - name: Upload screen inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-inventory
          path: screen-inventory-final/
          if-no-files-found: warn
          retention-days: 30

      # The merged manifest always has exactly 32 entries (dead or
      # truncated segments get synthesized misses), so its absence
      # means the merge step never produced one. Presence alone is
      # NOT success: the run also fails when fewer than
      # MIN_REACHED_STOPS stops were reached (see the env block at the
      # top of this file). Reached now means anchor-verified captures —
      # the crawl never records a wrong-layer screenshot as reached.
      - name: Verify manifest coverage meets the threshold
        run: |
          MANIFEST="screen-inventory-final/manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::No merged manifest.json — the merge step produced no inventory (no segment reported). Check the crawl jobs and the merge job logs."
            echo "## Screen inventory: NO MANIFEST" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "manifest.json found at $MANIFEST:"
          cat "$MANIFEST"
          python3 - "$MANIFEST" "$MIN_REACHED_STOPS" <<'PYEOF'
          import json, os, sys

          manifest_path, minimum = sys.argv[1], int(sys.argv[2])
          with open(manifest_path) as f:
              entries = json.load(f).get("entries", [])
          total = len(entries)
          reached = [e for e in entries if e.get("reached")]
          missed = [e for e in entries if not e.get("reached")]

          lines = [f"## Screen inventory: {len(reached)}/{total} stops reached "
                   f"(minimum {minimum})", ""]
          if missed:
              lines.append("### Missed screens")
              lines += [f"- `{e.get('screen', '?')}` — {e.get('note', '')}" for e in missed]
              lines.append("")
          if reached:
              lines.append("### Reached screens")
              lines += [f"- `{e.get('screen', '?')}`" for e in reached]
          summary = "\n".join(lines) + "\n"
          print(summary)
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a") as f:
                  f.write(summary)

          if len(reached) < minimum:
              print(f"::error::Screen inventory reached only {len(reached)}/{total} stops "
                    f"(< MIN_REACHED_STOPS={minimum}). Missed: "
                    + ", ".join(e.get("screen", "?") for e in missed))
              sys.exit(1)
          PYEOF
