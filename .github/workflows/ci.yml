name: CI

on:
  pull_request:
    branches: [master]

jobs:
  test-build-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Mechanics validation
        run: npm run mechanics:validate

      - name: Mechanics report
        run: npm run mechanics:report

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
