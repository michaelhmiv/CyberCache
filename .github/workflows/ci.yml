name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  wiki-map-check:
    # WARN mode (Wiki Phase 1): annotates PRs that change a mapped gameplay
    # source without touching its wiki page. Never fails the build; the
    # fail gate arrives in Phase 3. See docs/WIKI.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wiki map check (warn only)
        env:
          BASE_REF: origin/${{ github.base_ref }}
          WIKI_IMPACT_NONE: "${{ contains(github.event.pull_request.body, 'wiki-impact: none') && '1' || '' }}"
        run: node scripts/check-wiki-map.mjs

  test-build-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Mechanics validation
        run: npm run mechanics:validate

      - name: Mechanics report
        run: npm run mechanics:report

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: TypeScript (noEmit)
        run: npx tsc --noEmit

      - name: Architecture guard
        run: bash scripts/guard-architecture.sh
