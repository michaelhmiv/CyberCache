name: iOS TestFlight

# Manual-dispatch delivery lane, mirroring Android's Firebase App
# Distribution flow: build the app from master, sign it with CI-minted
# material (App Store Connect API — the PitTech pattern; no local-device
# steps), and upload to App Store Connect, where the build lands in
# TestFlight after Apple's processing. Dani's iPhone 15 Plus is the iOS
# test device.
#
# Prerequisites, in order: the iOS target (launch brief Track 1), the
# ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY Actions secrets, and the
# App Store Connect app record for com.michaelhmiv.cybercache (Track 4) —
# the signing step names whichever is missing.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cybercache-ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Require the iOS target
        run: |
          set -euo pipefail
          if [[ ! -d ios/App/App.xcodeproj ]]; then
            echo "::error::ios/App/App.xcodeproj not found — the iOS target (iOS launch brief Track 1) has not landed on master yet."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_ADMOB_REWARDED_CACHE_KEY_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_CACHE_KEY_AD_UNIT_ID_IOS }}
          VITE_ADMOB_TEST_ADS: "false"
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Mint CI signing material (App Store Connect API)
        uses: ./.github/actions/ios-signing

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      # Manual signing lives in the App target's Release build settings
      # (project.pbxproj) — it must NOT be passed on the command line,
      # which applies it to every target including the Swift Package
      # libraries, which reject provisioning profiles (archive exit 65).
      - name: Archive with CI signing
        run: >-
          xcodebuild archive
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/CyberCache.xcarchive
          -derivedDataPath build/ios-release
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          CYBERCACHE_ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID_IOS }}
          CODE_SIGNING_KEYCHAIN="$CYBERCACHE_KEYCHAIN_PATH"
          CODE_SIGNING_ALLOWED=YES

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>upload</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>TEAMID</string>
            <key>provisioningProfiles</key><dict>
              <key>com.michaelhmiv.cybercache</key><string>PROFILE</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :teamID $CYBERCACHE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.michaelhmiv.cybercache $CYBERCACHE_PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath build/CyberCache.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload signed archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-archive-${{ github.run_number }}
          path: build/CyberCache.xcarchive
          if-no-files-found: warn
          retention-days: 30
