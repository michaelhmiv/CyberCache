name: APK UX evidence capture
on:
  push:
    branches:
      - audit/android-ux-2026-11-01
permissions:
  contents: read
  actions: read
jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download exact signed release 300034
        uses: actions/download-artifact@v4
        with:
          name: cybercache-release-apk
          path: apk
          run-id: 41325951742
          github-token: ${{ github.token }}
      - name: Verify downloaded APK
        run: echo '10a9194625fb6928adee4042dad6d15ac4395800ec2e165dffb5b5b3278c6307  apk/app-release.apk' | sha256sum -c
      - name: Drive fresh Android guest workflows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          script: |
            adb install -r apk/app-release.apk
            python3 -c 'import base64;exec(base64.b64decode(""))'
      - name: Upload walkthrough evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybercache-ux-device-evidence-300034
          path: ux-evidence/
          if-no-files-found: warn
          retention-days: 14
